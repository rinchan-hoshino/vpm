name: Deploy VPM Listing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Website/**"
      - ".github/workflows/build-listing.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate listing and release artifact
        run: python tests/validate_listing.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static VPM listing
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
